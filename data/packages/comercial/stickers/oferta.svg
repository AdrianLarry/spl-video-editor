<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="ofertaBg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF5E3A"/>
      <stop offset="60%" stop-color="#FF2A2A"/>
      <stop offset="100%" stop-color="#C40000"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#600000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- 16-point starburst/burst badge -->
    <path d="M 200,20 L 235,55 L 285,45 L 305,90 L 350,105 L 345,155 L 380,185 L 355,230 L 375,275 L 330,300 L 330,350 L 280,355 L 255,395 L 205,375 L 165,400 L 135,365 L 85,370 L 70,325 L 25,310 L 35,260 L 5,225 L 30,180 L 15,135 L 60,115 L 65,65 L 115,65 L 140,25 L 190,40 Z" fill="url(#ofertaBg)"/>
    <!-- Inner ring -->
    <circle cx="200" cy="200" r="145" fill="none" stroke="#FFE600" stroke-width="6" stroke-dasharray="14 10"/>
    <circle cx="200" cy="200" r="132" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/>
    <!-- Stars -->
    <polygon points="200,60 205,75 220,75 208,85 212,100 200,90 188,100 192,85 180,75 195,75" fill="#FFE600"/>
    <!-- Text -->
    <text x="200" y="218" text-anchor="middle" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" filter="url(#textShadow)" letter-spacing="3">OFERTA</text>
    <text x="200" y="260" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="22" fill="#FFE600" letter-spacing="4">ESPECIAL</text>
  </g>
</svg>